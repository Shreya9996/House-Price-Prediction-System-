<!DOCTYPE html>
<html>
<head>
    <title>House Price Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<h2>House Price Prediction System</h2>

<form action="/predict" method="post">

    <input type="number" step="any" name="Area_sqft" placeholder="Area (sq ft)" required><br><br>

    <input type="number" name="Bedrooms" placeholder="Bedrooms" required><br><br>

    <input type="number" name="Bathrooms" placeholder="Bathrooms" required><br><br>

    <input type="number" name="Floors" placeholder="Floors" required><br><br>

    <input type="number" name="Parking" placeholder="Parking" required><br><br>

    <input type="number" name="Age_of_House" placeholder="Age of House (years)" required><br><br>

    <input type="number" step="any" name="Distance_from_City_km" placeholder="Distance from City (km)" required><br><br>

    <button type="submit">Predict Price</button>
</form>

<h3>{{ prediction_text }}</h3>

</body>
</html>
